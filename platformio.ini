[env:lolin_s2_mini]
platform = espressif32@8.0.0
board = lolin_s2_mini
framework = arduino
lib_ldf_mode = chain+
extra_scripts = pre:scripts/platformio_fs_include.py
monitor_speed = 115200
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
; From the running USB CDC application, 1200-bps touch enters the ROM downloader.
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
board_upload.before_reset = default-reset
build_type = release
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
